# Used by the Vercel deployment (python -m pip install -r requirements.txt is still the way to set up locally).
[project]
name = "datasage"
version = "1.0.0"
description = "An agent that checks messy tables, fixes them with your approval, and answers your question."
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
]

[tool.vercel]
entrypoint = "app.web.hosted:app"
