<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataSage · Data profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/analysis.css">
</head>
<body>
<div class="wrap">

<header class="bar">
  <a class="brand" href="/" aria-label="DataSage home">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="20" height="20" rx="5"/><path d="M3 10h20M10 10v13"/></svg>
    <span>DataSage</span>
  </a>
  <nav class="nav" aria-label="Pages">
    <a href="/">Run</a>
    <a href="/results">Results</a>
  </nav>
</header>

<main class="page">
  <section class="hero">
    <span class="eyebrow">Data profile</span>
    <h1 id="title">Your table, before and after</h1>
    <p class="lede" id="lede">Loading the run.</p>
  </section>
  <div id="tiles" class="tiles" aria-live="polite"></div>
  <section class="sec" aria-labelledby="h-cols" id="colSec" hidden>
    <div class="toolbar">
      <div class="sec-head"><div><h2 id="h-cols">Column by column</h2>
        <p>Each column in the uploaded table next to the same column in cleaned.csv.</p></div></div>
      <div id="filter"></div>
    </div>
    <div id="cols" class="cols"></div>
  </section>
</main>

</div>
<script src="/static/viz.js"></script>
<script src="/static/profile.js"></script>
</body>
</html>
