<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataSage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

<header class="bar">
  <a class="brand" href="/" aria-label="DataSage home">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="20" height="20" rx="5"/><path d="M3 10h20M10 10v13"/></svg>
    <span>DataSage</span>
  </a>
  <div class="files">
    <label class="chip" id="fileChip" title="Choose a CSV or Excel file">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z"/><path d="M9 1.5V5h3.5"/></svg>
      <span id="fileName">Choose file</span>
      <input id="fileInput" type="file" accept=".csv,.xlsx" class="sr">
    </label>
    <label class="chip set" id="sheetChip" hidden>
      <span>Sheet</span>
      <select id="sheetSel" class="sheet-sel" aria-label="Excel sheet"></select>
    </label>
    <label class="chip quiet" id="rulesChip" title="Optional JSON rules file">
      <span id="rulesName">+ rules</span>
      <input id="rulesInput" type="file" accept=".json,application/json" class="sr">
    </label>
  </div>
  <form id="askForm" class="ask-form">
    <label for="question" class="sr">Question</label>
    <input id="question" class="q" placeholder="Ask a question about the table" autocomplete="off">
    <button id="runBtn" class="btn primary" type="submit">Run</button>
  </form>
</header>

<section id="empty" class="empty">
  <div id="drop" class="drop">
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4h11l9 9v23H12z"/><path d="M23 4v9h9"/><path d="M22 30V19m-4.5 4.5L22 19l4.5 4.5"/></svg>
    <p class="drop-title">Drop a CSV or Excel file</p>
    <p class="drop-sub">Ask a question. DataSage cleans what the answer depends on and asks before risky changes.</p>
    <div class="samples">
      <button class="ghost" type="button" data-sample="small">Sample · 8 rows</button>
      <button class="ghost" type="button" data-sample="large">Sample · 1,208 rows</button>
    </div>
  </div>
</section>

<div id="work" class="work" hidden>
  <main class="main">
    <div id="banner" class="banner" hidden></div>
    <div class="table-box">
      <div id="table" class="table" role="table" aria-label="Your table"></div>
    </div>
    <div class="foot">
      <ol class="rail" aria-label="Run progress">
        <li data-phase="rules"><span class="dot"></span><span class="lbl">Rules</span></li>
        <li data-phase="check"><span class="dot"></span><span class="lbl">Checks</span></li>
        <li data-phase="fix"><span class="dot"></span><span class="lbl">Fixes</span></li>
        <li data-phase="answer"><span class="dot"></span><span class="lbl">Answer</span></li>
      </ol>
      <div class="status" aria-live="polite"><span id="spin" class="spin" hidden></span><span id="status">Starting</span></div>
    </div>
    <p id="more" class="more" hidden></p>
    <section id="health" class="health" aria-label="Data health" hidden></section>
  </main>

  <aside class="side" aria-label="Answer">
    <div id="waiting" class="waiting">
      <span class="w-title">Answer</span>
      <span>Appears once the columns your question uses are clean. Risky fixes wait for you.</span>
      <span id="counts" class="w-counts"></span>
    </div>
    <div id="answer" class="answer" hidden>
      <div class="a-head">
        <span id="aTitle" class="a-title"></span>
        <span id="aMeta" class="a-meta"></span>
      </div>
      <div id="aGroups" class="a-groups"></div>
      <ul id="aLog" class="a-log"></ul>
      <details class="a-summary"><summary>Agent's summary</summary><p id="aSummary"></p></details>
      <div id="aFiles" class="a-files"></div>
      <span id="aStats" class="a-stats"></span>
    </div>
  </aside>
</div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
