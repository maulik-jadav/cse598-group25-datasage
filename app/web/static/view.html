<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataSage · Run files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/analysis.css">
<link rel="stylesheet" href="/static/view.css">
</head>
<body>
<div class="wrap">

<header class="bar">
  <a class="brand" href="/" aria-label="DataSage home">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="20" height="20" rx="5"/><path d="M3 10h20M10 10v13"/></svg>
    <span>DataSage</span>
  </a>
  <nav class="nav" aria-label="Pages">
    <a href="/">Run</a>
    <a href="/results">Results</a>
  </nav>
</header>

<main class="page">
  <section class="hero">
    <span class="eyebrow">Run files</span>
    <h1 id="title">Your files</h1>
    <p class="lede" id="lede">Loading.</p>
  </section>

  <nav class="tabs" role="tablist" aria-label="Files">
    <button class="tab" role="tab" data-file="cleaned.csv">Cleaned table</button>
    <button class="tab" role="tab" data-file="report.md">Report</button>
    <button class="tab" role="tab" data-file="replay.py">Replay script</button>
    <button class="tab" role="tab" data-file="trace.jsonl">Step log</button>
    <a class="tab tab-link" id="profileLink" href="#">Column profile</a>
    <a class="ghost small dl" id="download" href="#" download>Download</a>
  </nav>

  <section id="viewer" class="viewer" aria-live="polite"></section>
</main>

</div>
<script src="/static/view.js"></script>
</body>
</html>
